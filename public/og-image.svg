<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="55%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#b300ff"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b300ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b300ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="170" cy="120" r="360" fill="url(#glowCyan)"/>
  <circle cx="1040" cy="540" r="380" fill="url(#glowPurple)"/>

  <!-- logo mark -->
  <rect x="80" y="80" width="96" height="96" rx="22" fill="#0a0e27" stroke="url(#neon)" stroke-width="2"/>
  <text x="128" y="148" font-family="monospace" font-size="58" font-weight="700" fill="url(#neon)" text-anchor="middle">R</text>

  <!-- name -->
  <text x="80" y="330" font-family="'Syne', 'Segoe UI', sans-serif" font-size="92" font-weight="800" fill="#ffffff">Rohan Vishwakarma</text>

  <!-- role -->
  <text x="82" y="408" font-family="monospace" font-size="40" font-weight="500" fill="url(#neon)">Full Stack Developer</text>

  <!-- subtitle -->
  <text x="82" y="470" font-family="'Segoe UI', sans-serif" font-size="30" fill="#8b93b8">React · Next.js · Node.js · TypeScript</text>

  <!-- domain -->
  <text x="80" y="565" font-family="monospace" font-size="26" fill="#5a6388">rohanvishwakarma.co.in</text>

  <rect x="0" y="624" width="1200" height="6" fill="url(#neon)"/>
</svg>
